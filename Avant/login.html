<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <title>Avant | Authentication</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Montserrat:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* Google's iframe button ignores our CSS, so we size/shape it via
           the JS config instead — this wrapper just controls layout spacing
           and gives it the same footprint the old custom button had. */
        #googleSignInBtn {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 4px;
            min-height: 44px; /* stop the layout from jumping while the iframe loads */
        }
    </style>
</head>

<body class="login-bg">

    <div class="login-split-container">
        <div class="login-auth-side">
            <div class="login-inner-wrap">
                <a href="index.html" class="login-back-logo">
                    <img src="assets/logoname.png" alt="Avant" class="logo-name-image-login">
                </a>

                <div class="login-title-section">
                    <h1 id="authTitle">Log In</h1>
                    <p id="authSubtitle">Enter your details to access the AVANT ecosystem.</p>
                </div>

                <!-- Real Google Identity Services button renders here -->
                <div id="googleSignInBtn"></div>

                <div class="auth-divider"><span>Or email</span></div>

                <form id="mainLoginForm">
                    <div class="auth-input-group" id="nameGroup" style="display: none;">
                        <label>Full Name</label>
                        <input type="text" id="userNameInput" placeholder="Enter Username" minlength="5">
                    </div>

                    <div class="auth-input-group">
                        <label>Email</label>
                        <input type="email" id="userEmail" placeholder="Enter Email" required>
                    </div>

                    <div class="auth-input-group password-group">
                        <label>Password</label>
                        <div style="position: relative;">
                            <input type="password" id="userPassword" placeholder="Enter Password" minlength="8"
                                required>
                            <button type="button" id="togglePassword"
                                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #000000; cursor: pointer; font-size: 12px; font-family: 'Montserrat';">
                                SHOW
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit-btn" id="submitBtn">Log In</button>
                </form>

                <p class="auth-footer-text" id="toggleText">
                    No account? <a href="#" onclick="toggleAuthMode(event)">Sign Up here</a>
                </p>
            </div>
        </div>

        <div class="login-visual-side">
            <div class="visual-overlay"></div>
            <img src="assets/login-img.jpg" alt="Avant Fashion Editorial">
        </div>
    </div>

    <!-- Google Identity Services library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        let isLoginMode = true;
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#userPassword');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.textContent = type === 'password' ? 'SHOW' : 'HIDE';
        });

        function toggleAuthMode(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;

            const title = document.getElementById('authTitle');
            const submitBtn = document.getElementById('submitBtn');
            const toggleLink = document.getElementById('toggleText');
            const nameGroup = document.getElementById('nameGroup');
            const nameInput = document.getElementById('userNameInput');

            if (isLoginMode) {
                title.innerText = "Log In";
                submitBtn.innerText = "Log In";
                nameGroup.style.display = "none";
                nameInput.required = false;
                nameInput.value = "";
                toggleLink.innerHTML = 'No account? <a href="#" onclick="toggleAuthMode(event)">Sign Up here</a>';
            } else {
                title.innerText = "Sign Up";
                submitBtn.innerText = "Create Account";
                nameGroup.style.display = "block";
                nameInput.required = true;
                toggleLink.innerHTML = 'Already have an account? <a href="#" onclick="toggleAuthMode(event)">Log In here</a>';
            }
        }

        document.getElementById('mainLoginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPassword').value;
            const nameInput = document.getElementById('userNameInput').value;

            if (!isLoginMode) {
                const usernameRegex = /^[a-zA-Z0-9._]+$/;
                if (!usernameRegex.test(nameInput)) {
                    alert("Username Error: Only letters, numbers, dots, and underscores allowed.");
                    return;
                }
            }

            const endpoint = isLoginMode ? '/api/login' : '/api/signup';
            const payload = isLoginMode ? { email, password } : { name: nameInput, email, password };

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.name) {
                        const cleanName = data.name.toLowerCase().replace(/\s+/g, '');
                        localStorage.setItem('avantUserName', cleanName);
                    }
                    alert(data.message);
                    window.location.replace("index.html");
                } else {
                    alert("Error: " + data.message);
                }
            } catch (error) {
                console.error("Critical Fetch Error:", error);
                alert("Server connection failed! Check console (F12).");
            }
        });

        // ================================================================
        // GOOGLE SIGN-IN — fetch Client ID from server (never hardcoded),
        // then init + render the button once the GSI script is ready.
        // ================================================================
        async function handleGoogleCredential(response) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('avantUserName', data.name.toLowerCase());
                    alert(data.message);
                    window.location.replace("index.html");
                } else {
                    alert("Google Sign-In failed: " + (data.message || 'Unknown error'));
                }
            } catch (err) {
                console.error("Google auth request failed:", err);
                alert("Server connection failed during Google Sign-In.");
            }
        }

        async function initGoogleSignIn() {
            try {
                const cfgRes = await fetch('/api/config/google-client-id');
                const cfg = await cfgRes.json();

                if (!cfg.clientId) {
                    console.warn('⚠ GOOGLE_CLIENT_ID not set in .env — hiding Google button');
                    document.getElementById('googleSignInBtn').style.display = 'none';
                    return;
                }

                if (!window.google || !google.accounts || !google.accounts.id) {
                    // GSI script hasn't loaded yet — retry shortly
                    setTimeout(initGoogleSignIn, 200);
                    return;
                }

                google.accounts.id.initialize({
                    client_id: cfg.clientId,
                    callback: handleGoogleCredential
                });

                // Size/shape configured here since Google's iframe ignores our CSS —
                // 'pill' + 'large' + explicit width matches the old custom button's footprint.
                google.accounts.id.renderButton(
                    document.getElementById('googleSignInBtn'),
                    {
                        type: 'standard',
                        theme: 'outline',
                        size: 'large',
                        shape: 'pill',
                        text: 'continue_with',
                        logo_alignment: 'left',
                        width: 400
                    }
                );
            } catch (err) {
                console.error('Google Sign-In init failed:', err);
                document.getElementById('googleSignInBtn').style.display = 'none';
            }
        }

        initGoogleSignIn();
    </script>
</body>

</html>
