<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <title>Avant | Authentication</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Montserrat:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* Google's iframe button ignores our CSS, so we size/shape it via
           the JS config instead — this wrapper just controls layout spacing
           and gives it the same footprint the old custom button had. */
        #googleSignInBtn {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 4px;
            min-height: 44px; /* stop the layout from jumping while the iframe loads */
        }
    </style>
</head>

<body class="login-bg">

    <div id="login-root"></div>

    <!-- Google Identity Services library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="js/react/login.js"></script>
</body>

</html>
